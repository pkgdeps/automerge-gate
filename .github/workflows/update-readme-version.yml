name: update-readme-version

# After a release is published, open a PR that points the usage examples
# in README.md and docs/migration-from-merge-gatekeeper.md at the new tag.
on:
  release:
    types: [published]

permissions: {}

jobs:
  update:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      RELEASE_URL: ${{ github.event.release.html_url }}
      BASE: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update version references
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Skip: $TAG is not a vX.Y.Z tag"
            exit 0
          fi
          sed -i -E "s#(pkgdeps/automerge-gate@)v[0-9]+\.[0-9]+\.[0-9]+#\1${TAG}#g" \
            README.md docs/migration-from-merge-gatekeeper.md
      - name: Open pull request
        run: |
          if git diff --quiet; then
            echo "Version references already point at $TAG"
            exit 0
          fi
          branch="docs/update-version-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "docs: update version references to ${TAG}"
          git push origin "$branch"
          gh pr create \
            --base "$BASE" \
            --head "$branch" \
            --title "docs: update version references to ${TAG}" \
            --body "Points the usage examples at [${TAG}](${RELEASE_URL})."
