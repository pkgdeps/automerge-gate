name: test-self

on:
  pull_request:
    types: [opened, synchronize, reopened, auto_merge_enabled]
  pull_request_review:
    types: [submitted]

# Public mode: GITHUB_TOKEN is read-only on fork PRs, so the gate signal is
# this job's own check_run (its `name:` is the required check), not a commit
# status written through the API.
permissions:
  checks: read
  pull-requests: read
  actions: read

jobs:
  gate:
    # Must match the required check in the main ruleset.
    name: automerge-gate/self-test
    # No job-level `if:` on purpose. A skipped job reports "Success" to the
    # required check, so skipping non-approve reviews would let a plain
    # comment review pass the gate. Every review polls instead.
    # `pull_request_review` stays because release PRs opened by GITHUB_TOKEN
    # do not start `pull_request` workflows (see docs/RELEASING.md).
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run build
      - name: Self-host gate
        uses: ./
        with:
          gate-mode: 'public'
